name: "Monitor: The University Of Adelaide"

on:
  workflow_dispatch:

concurrency:
  group: monitor-the-university-of-adelaide
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "The University Of Adelaide" --scraper "The University Of Adelaide/adelaide_real.py" --sql "The University Of Adelaide/adelaide_update.sql" --snapshot "The University Of Adelaide/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "The University Of Adelaide/snapshot.json"
          git add "The University Of Adelaide"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for The University Of Adelaide [skip ci]"
            git push
          fi
