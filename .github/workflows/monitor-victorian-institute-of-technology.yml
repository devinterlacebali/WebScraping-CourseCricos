name: "Monitor: Victorian Institute of Technology"

on:
  workflow_dispatch:

concurrency:
  group: monitor-victorian-institute-of-technology
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "Victorian Institute of Technology" --scraper "Victorian Institute of Technology/vit.py" --sql "Victorian Institute of Technology/vit_update.sql" --snapshot "Victorian Institute of Technology/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Victorian Institute of Technology/snapshot.json"
          git add "Victorian Institute of Technology"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for Victorian Institute of Technology [skip ci]"
            git push
          fi
