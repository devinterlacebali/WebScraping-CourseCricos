name: "Monitor: Australian Health and Science Institute"

on:
  workflow_dispatch:

concurrency:
  group: monitor-australian-health-and-science-institute
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "Australian Health and Science Institute" --scraper "Australian Health and Science Institute/ahsi.py" --sql "Australian Health and Science Institute/ahsi_update.sql" --snapshot "Australian Health and Science Institute/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Australian Health and Science Institute/snapshot.json"
          git add "Australian Health and Science Institute"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for Australian Health and Science Institute [skip ci]"
            git push
          fi
