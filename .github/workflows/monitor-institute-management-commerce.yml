name: "Monitor: Institute Management Commerce"

on:
  workflow_dispatch:

concurrency:
  group: monitor-institute-management-commerce
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "Institute Management Commerce" --scraper "Institute Management Commerce/imc.py" --sql "Institute Management Commerce/imc_update.sql" --snapshot "Institute Management Commerce/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Institute Management Commerce/snapshot.json"
          git add "Institute Management Commerce"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for Institute Management Commerce [skip ci]"
            git push
          fi
