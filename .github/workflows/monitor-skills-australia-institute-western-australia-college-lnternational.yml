name: "Monitor: Skills Australia Institute, Western Australia College lnternational"

on:
  workflow_dispatch:

concurrency:
  group: monitor-skills-australia-institute-western-australia-college-lnternational
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "Skills Australia Institute, Western Australia College lnternational" --scraper "Skills Australia Institute, Western Australia College lnternational/skillsaustralia.py" --sql "Skills Australia Institute, Western Australia College lnternational/skills_output.sql" --snapshot "Skills Australia Institute, Western Australia College lnternational/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Skills Australia Institute, Western Australia College lnternational/snapshot.json"
          git add "Skills Australia Institute, Western Australia College lnternational"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for Skills Australia Institute, Western Australia College lnternational [skip ci]"
            git push
          fi
