name: "Monitor: Australian Institute of Higher Education"

on:
  workflow_dispatch:

concurrency:
  group: monitor-australian-institute-of-higher-education
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "Australian Institute of Higher Education" --scraper "Australian Institute of Higher Education/aih.py" --sql "Australian Institute of Higher Education/aih_output.sql" --snapshot "Australian Institute of Higher Education/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Australian Institute of Higher Education/snapshot.json"
          git add "Australian Institute of Higher Education"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for Australian Institute of Higher Education [skip ci]"
            git push
          fi
