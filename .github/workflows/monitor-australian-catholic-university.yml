name: "Monitor: Australian Catholic University"

on:
  workflow_dispatch:

concurrency:
  group: monitor-australian-catholic-university
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "Australian Catholic University" --scraper "Australian Catholic University/acu.py" --sql "Australian Catholic University/acu_courses_update.sql" --snapshot "Australian Catholic University/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Australian Catholic University/snapshot.json"
          git add "Australian Catholic University"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for Australian Catholic University [skip ci]"
            git push
          fi
