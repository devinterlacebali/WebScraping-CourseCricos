name: Weekly Scraper & Change Monitor

on:
  # Otomatis tiap Senin 00:00 UTC (07:00 WIB).
  schedule:
    - cron: '0 0 * * 1'
  # Bisa juga dijalankan manual dari tab Actions.
  workflow_dispatch:

# Cegah dua run jalan barengan (hindari commit bentrok).
concurrency:
  group: weekly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # supaya bisa commit snapshot balik ke repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor (Crown Institute)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python monitor_changes.py \
            --name "Crown Institute of Higher Education" \
            --scraper "Crown Institute of Higher Education/cihe.py" \
            --sql "Crown Institute of Higher Education/cihe_courses_update.sql" \
            --snapshot "Crown Institute of Higher Education/snapshot.json"

      - name: Commit snapshot kalau berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Crown Institute of Higher Education/snapshot.json"
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan snapshot."
          else
            git commit -m "chore: update snapshot Crown Institute [skip ci]"
            git push
          fi
