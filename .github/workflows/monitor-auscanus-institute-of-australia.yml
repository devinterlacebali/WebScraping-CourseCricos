name: "Monitor: Auscanus Institute of Australia"

on:
  workflow_dispatch:

concurrency:
  group: monitor-auscanus-institute-of-australia
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor_changes.py --name "Auscanus Institute of Australia" --scraper "Auscanus Institute of Australia/auscanus.py" --sql "Auscanus Institute of Australia/auscanus_update.sql" --snapshot "Auscanus Institute of Australia/snapshot.json"

      - name: Commit snapshot & changes SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Auscanus Institute of Australia/snapshot.json"
          git add "Auscanus Institute of Australia"/*_changes_*.sql || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: snapshot & changes for Auscanus Institute of Australia [skip ci]"
            git push
          fi
